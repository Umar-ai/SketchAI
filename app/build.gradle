plugins {
    id 'com.android.application'
}

android {
    namespace 'com.umer.sketchai'
    compileSdk 35

    defaultConfig {
        applicationId 'com.umer.sketchai'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // AGP 8.7.3 supports 16 KB APK packaging. The LiteRT binary must also
    // have 16 KB aligned ELF LOAD segments; check the built APK as documented.
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    buildTypes {
        release { minifyEnabled false }
    }
}

dependencies {
    // LiteRT 1.4.2 retains org.tensorflow.lite.Interpreter (CPU) and
    // provides native runtime compatibility for Android 16 KB page devices.
    // Never combine this with old org.tensorflow:tensorflow-lite:2.17.0.
    implementation 'com.google.ai.edge.litert:litert:1.4.2'
    implementation 'com.google.ai.edge.litert:litert-api:1.4.2'
    testImplementation 'junit:junit:4.13.2'
}
